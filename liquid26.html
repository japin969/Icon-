<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;height:100vh;background:#7a5cff;display:flex;align-items:flex-end;font-family:sans-serif;padding:12px}
.liquid{width:100%;height:82px;border-radius:28px;position:relative;display:flex;align-items:center;background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.35);box-shadow:0 12px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.6);overflow:hidden}
.item{flex:1;text-align:center;color:rgba(255,255,255,.65);cursor:pointer;position:relative;z-index:2}
.item svg{width:27px;height:27px;transition:transform .4s}
.item span{font-size:11px;display:block}
.item.active{color:#fff}
.item.active svg{transform:translateY(-4px) scale(1.22)}
.dot{width:5px;height:5px;background:#fff;border-radius:50%;margin:5px auto 0;transform:scale(0);transition:transform .4s}
.item.active .dot{transform:scale(1)}
.pill{position:absolute;top:8px;height:54px;width:18%;border-radius:20px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35);transition:left .45s;left:1%}
</style></head><body>
<div class="liquid"><div class="pill" id="pill"></div>
<div class="item active" onclick="go(this,0)"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.5 0-2.9-.4-4.1-1L3 20l1-5.4A8.5 8.5 0 1 1 21 11.5z"/><path d="M7.5 9.5h9M7.5 12.5h9M7.5 15.5h5.5"/></svg><span>Chat</span><div class="dot"></div></div>
<div class="item" onclick="go(this,1)"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"><path d="M5 4c0-.5.4-1 1-1 1.5 0 2.5 1 3.5 2 .8.8 1 1.5.5 2.5-.4.8-1 1.5-1.5 2-.3.3-.3.8 0 1.2 1.5 2.5 3.5 4.5 6 6 .4.3.9.3 1.2 0 .5-.5 1.2-1.1 2-1.5 1-.5 1.7-.3 2.5.5 1 1 2 2 2 3.5 0 .6-.5 1-1 1-4.5.5-10-2-13.5-5.5C6 12 4 7 5 4z"/></svg><span>Panggilan</span><div class="dot"></div></div>
<div class="item" onclick="go(this,2)"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"><path d="M9 18V5l12-2v13M9 18a2.5 2.5 0 1 1-2.5-2.5A2.5 2.5 0 0 1 9 18zM21 16a2.5 2.5 0 1 1-2.5-2.5A2.5 2.5 0 0 1 21 16zM9 8l12-2"/></svg><span>Music</span><div class="dot"></div></div>
<div class="item" onclick="go(this,3)"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"><rect x="9.5" y="9.5" width="5" height="5"/><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Hub</span><div class="dot"></div></div>
<div class="item" onclick="go(this,4)"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.17a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.17a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.17a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.17a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Setting</span><div class="dot"></div></div>
</div>
<script>function go(e,i){document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));e.classList.add('active');document.getElementById('pill').style.left=(1+i*20)+'%';}</script>
</body></html>
